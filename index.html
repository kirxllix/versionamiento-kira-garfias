<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Data Table with IndexedDB</title>

    <!-- Google Fonts: Baloo 2 (titulos) y Quicksand (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Cinnamoroll Product List</h1>

    <img class="cute-gif"
         src="https://media.giphy.com/media/xKRa4f8OO5jiw/giphy.gif"
         alt="Cinnamoroll volando entre las nubes">

    <div class="counter-card" id="counterCard">
        Products registered: <span id="productCount">0</span>
    </div>

    <div class="container">

        <div class="formContainer">
            <label for="name">Product Name:</label>
            <input type="text" id="name" placeholder="Enter product name">
            
            <label for="price">Price:</label>
            <input type="number" id="price" placeholder="Enter product price" min="1">
            
            <button id="addProduct">Add Product</button>
        </div>

      
        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
          
            </tbody>
        </table>
    </div>

    <footer class="app-footer">
        <p>Hecho por <strong>Kira Garfias</strong> &middot; @kirxllix</p>
    </footer>

    <script src="functions.js"></script>
</body>
</html>
